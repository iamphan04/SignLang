<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VSL Translator - AI Sign Language Translation</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&family=Outfit:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0f172a;
            --glass-bg: rgba(30, 41, 59, 0.7);
            --glass-border: rgba(255, 255, 255, 0.1);
            --primary-accent: #38bdf8;
            --secondary-accent: #818cf8;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(at 0% 0%, rgba(56, 189, 248, 0.15) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(129, 140, 248, 0.15) 0px, transparent 50%);
            background-attachment: fixed;
            font-family: 'Inter', sans-serif;
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        header {
            width: 100%;
            padding: 2rem 0;
            text-align: center;
            margin-bottom: 1rem;
        }

        h1 {
            font-family: 'Outfit', sans-serif;
            font-size: 2.5rem;
            margin: 0;
            background: linear-gradient(135deg, var(--primary-accent), var(--secondary-accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 800;
            letter-spacing: -0.5px;
        }

        p.subtitle {
            color: var(--text-muted);
            font-size: 1.1rem;
            margin-top: 0.5rem;
        }

        .main-container {
            display: flex;
            flex-direction: column;
            gap: 2rem;
            width: 90%;
            max-width: 1200px;
            align-items: center;
        }

        /* Camera Feed Container with Glassmorphism */
        .camera-container {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 1rem;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            box-shadow: 0 20px 40px rgba(0,0,0,0.4), 
                        inset 0 1px 0 rgba(255,255,255,0.1);
            position: relative;
            overflow: hidden;
            width: 100%;
            max-width: 720px;
            aspect-ratio: 4/3;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        .camera-container::before {
            content: '';
            position: absolute;
            top: 0; left: -100%; width: 50%; height: 100%;
            background: linear-gradient(to right, transparent, rgba(255,255,255,0.05), transparent);
            transform: skewX(-20deg);
            animation: shine 6s infinite;
        }

        @keyframes shine {
            0% { left: -100%; }
            20% { left: 200%; }
            100% { left: 200%; }
        }

        #video-feed {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 16px;
            background-color: #000;
        }

        /* Translator Text Box */
        .translator-box {
            background: linear-gradient(145deg, rgba(30, 41, 59, 0.8), rgba(15, 23, 42, 0.9));
            border: 1px solid var(--primary-accent);
            border-radius: 20px;
            padding: 2rem;
            width: 100%;
            max-width: 720px;
            min-height: 150px;
            box-shadow: 0 10px 30px rgba(56, 189, 248, 0.1);
            position: relative;
            transition: all 0.3s ease;
        }

        .translator-box:hover {
            box-shadow: 0 15px 40px rgba(56, 189, 248, 0.2);
            transform: translateY(-2px);
        }

        .box-label {
            position: absolute;
            top: -12px;
            left: 30px;
            background: var(--bg-color);
            padding: 0 10px;
            font-size: 0.9rem;
            color: var(--primary-accent);
            font-weight: 600;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        #translated-text {
            font-family: 'Outfit', sans-serif;
            font-size: 2.2rem;
            line-height: 1.4;
            color: var(--text-main);
            margin: 0;
            min-height: 3rem;
            word-wrap: break-word;
        }

        .cursor {
            display: inline-block;
            width: 3px;
            height: 2.2rem;
            background-color: var(--primary-accent);
            animation: blink 1s step-end infinite;
            vertical-align: middle;
            margin-left: 4px;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        .controls {
            display: flex;
            gap: 1rem;
            margin-top: 1.5rem;
            width: 100%;
            max-width: 720px;
            justify-content: flex-end;
        }

        button {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--glass-border);
            color: var(--text-main);
            padding: 0.8rem 1.5rem;
            border-radius: 12px;
            font-family: 'Inter', sans-serif;
            font-weight: 600;
            font-size: 0.95rem;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        button:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: var(--primary-accent);
            color: var(--primary-accent);
        }

        button.primary {
            background: linear-gradient(135deg, var(--primary-accent), var(--secondary-accent));
            color: #000;
            border: none;
        }
        
        button.primary:hover {
            opacity: 0.9;
            color: #000;
            box-shadow: 0 0 15px rgba(56, 189, 248, 0.4);
        }

        /* Pulse animation when new letter added */
        @keyframes text-pulse {
            0% { transform: scale(1); color: var(--primary-accent); }
            50% { transform: scale(1.05); color: #fff; }
            100% { transform: scale(1); color: var(--text-main); }
        }
        
        .pulse-text {
            display: inline-block;
            animation: text-pulse 0.4s ease-out forwards;
        }

    </style>
</head>
<body>

    <header>
        <h1>VSL Translator</h1>
        <p class="subtitle">AI-powered Vietnamese Sign Language Translation in Real-Time</p>
    </header>

    <div class="main-container">
        
        <div class="camera-container">
            <img id="video-feed" src="/video_feed" alt="Video Stream">
        </div>

        <div class="translator-box">
            <div class="box-label">Live Translation</div>
            <div id="translated-text"></div><span class="cursor"></span>
        </div>

        <div class="controls">
            <button onclick="addSpace()">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12h16"/></svg>
                Space
            </button>
            <button onclick="backspace()">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 4H8l-7 8 7 8h13a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2z"/><line x1="18" y1="9" x2="12" y2="15"/><line x1="12" y1="9" x2="18" y2="15"/></svg>
                Backspace
            </button>
            <button onclick="clearText()" style="color: #f87171;">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
                Clear
            </button>
        </div>

    </div>

    <script>
        const textContainer = document.getElementById('translated-text');
        let currentText = "";
        let lastVersion = 0;

        // Function to fetch the latest recognized text from the server
        async function fetchTranslation() {
            try {
                const response = await fetch('/get_text');
                const data = await response.json();
                
                if (data.text !== currentText || data.version !== lastVersion) {
                    
                    // If a new character was just appended, animate it
                    if (data.text.length > currentText.length && currentText === data.text.substring(0, currentText.length)) {
                        const newChar = data.text.substring(currentText.length);
                        const span = document.createElement('span');
                        span.className = 'pulse-text';
                        span.innerText = newChar;
                        
                        textContainer.innerHTML = currentText; 
                        textContainer.appendChild(span);
                        
                        setTimeout(() => {
                            textContainer.innerHTML = data.text;
                        }, 400);
                    } else {
                        textContainer.innerText = data.text;
                    }
                    
                    currentText = data.text;
                    lastVersion = data.version;
                }
            } catch (error) {
                console.error("Error fetching translation:", error);
            }
        }

        // Action buttons
        async function sendAction(action) {
            try {
                await fetch('/action', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ action: action })
                });
                fetchTranslation(); // force update immediately
            } catch (error) {
                console.error("Error sending action:", error);
            }
        }

        function clearText() { sendAction('clear'); }
        function backspace() { sendAction('backspace'); }
        function addSpace() { sendAction('space'); }

        // Poll every 250ms
        setInterval(fetchTranslation, 250);
    </script>
</body>
</html>
